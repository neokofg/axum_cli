[package]
name = "axum-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool for axum_template project scaffolding and development"
authors = ["neoko"]

[[bin]]
name = "axum"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Templates
tera = "1"
heck = "0.5"

# File operations
walkdir = "2"
fs_extra = "1"

# Async
tokio = { version = "1", features = ["full", "process"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utils
colored = "3"
dialoguer = "0.11"
indicatif = "0.17"
anyhow = "1"
chrono = "0.4"
which = "7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
